name: 📱 Android Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: gradle

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 8512546
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: 📦 Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: 🔐 Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: 🏗️ Build Debug APK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        ./gradlew assembleDebug --stacktrace --info

    - name: ✅ Verify APK
      run: |
        ls -la app/build/outputs/apk/debug/
        file app/build/outputs/apk/debug/app-debug.apk

    - name: 📤 Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: 🎉 Success message
      run: |
        echo "✅ APK built successfully!"
        echo "📦 File: app-debug.apk"
        echo "📊 Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

  release:
    name: 🏷️ Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 8512546
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: 🔐 Grant execute permission
      run: chmod +x gradlew

    - name: 🏗️ Build Release APK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        ./gradlew assembleRelease --stacktrace

    - name: 📤 Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: android-app-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90

    - name: 📋 Summary
      run: |
        echo "## 📱 Android App Built!" >> $GITHUB_STEP_SUMMARY
        echo "✅ Debug APK created" >> $GITHUB_STEP_SUMMARY
        echo "✅ Release APK created" >> $GITHUB_STEP_SUMMARY
        echo "📦 [Download Debug APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
